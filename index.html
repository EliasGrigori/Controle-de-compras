<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<title>Controle de Compras</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238b5cf6'/%3E%3Cpath d='M14 18h6l5 22h20l5-16H24' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='48' r='4' fill='white'/%3E%3Ccircle cx='43' cy='48' r='4' fill='white'/%3E%3C/svg%3E">
<style>
:root,body[data-theme="dark"]{--bg:#0a0a0f;--surface:#13131c;--surface-2:#1a1a26;--surface-3:#232332;--border:#262632;--border-light:#33334a;--text:#e8e8ed;--text-muted:#a4a4b4;--text-dim:#7c7c90;--primary:#8b5cf6;--primary-soft:rgba(139,92,246,.16);--on-primary:#fff;--ok:#5bb592;--warn:#d8a657;--crit:#e07b7b;--info:#5fb0c9;--row-hover:#1f1f2d;--shadow:0 14px 36px rgba(0,0,0,.5);--ok-soft:rgba(91,181,146,.15);--warn-soft:rgba(216,166,87,.15);--crit-soft:rgba(224,123,123,.15);--info-soft:rgba(95,176,201,.15);
--c-carne:#e07b7b;--c-graos:#d8a657;--c-limpeza:#5fb0c9;--c-outros:#a78bfa;--r-chip:6px;--r-ctl:10px;--r-card:14px}
body[data-theme="light"]{--bg:#f5f5f7;--surface:#fff;--surface-2:#f0f0f4;--surface-3:#e4e4ea;--border:#d8d8e0;--border-light:#c0c0cc;--text:#1a1a26;--text-muted:#4f4f63;--text-dim:#6e6e80;--primary:#7c3aed;--primary-soft:rgba(124,58,237,.11);--on-primary:#fff;--ok:#2f8566;--warn:#94661a;--crit:#b04a4a;--info:#2a7d93;--row-hover:#f0f0f4;--shadow:0 14px 36px rgba(20,20,40,.18);--ok-soft:rgba(47,133,102,.14);--warn-soft:rgba(154,107,31,.14);--crit-soft:rgba(176,74,74,.13);--info-soft:rgba(42,125,147,.14);
--c-carne:#c25353;--c-graos:#a8761f;--c-limpeza:#2a7d93;--c-outros:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--primary)}
.app{display:block}
/* ---------- rail (desktop) ---------- */
.rail{display:none}
.col{min-width:0}
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.topbar-row{display:flex;align-items:center;gap:6px;min-height:56px;padding:0 8px 0 16px}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:var(--r-ctl);display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:22px;height:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;background:var(--surface-2);color:var(--text-muted);font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab.active{background:var(--primary);color:var(--on-primary)}
.main{padding:16px 14px calc(96px + env(safe-area-inset-bottom));max-width:1200px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;font-size:12px;font-weight:600;color:var(--text-muted)}
.bn .pill{width:52px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.bn svg{width:22px;height:22px}
.bn.active{color:var(--primary)}
.bn.active .pill{background:var(--primary-soft)}
.bn .dot{position:absolute;margin:-14px 0 0 22px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media(min-width:860px){
  .app{display:grid;grid-template-columns:240px 1fr}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px}
  .rail .brand{display:flex;align-items:center;gap:10px;margin:0 4px 16px}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .brand-mark svg{width:22px;height:22px}
  .brand-name{font-weight:800;font-size:16px;letter-spacing:-.3px;line-height:1.2}
  .brand-sub{font-size:12px;color:var(--text-muted)}
  .rail-sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:700;margin:12px 12px 4px}
  .rn{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border-radius:var(--r-ctl);color:var(--text-muted);font-weight:600;font-size:14.5px;text-align:left;position:relative}
  .rn svg{width:20px;height:20px;flex:none}
  .rn:hover{background:var(--surface-2);color:var(--text)}
  .rn.active{background:var(--primary-soft);color:var(--primary)}
  .rn.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--primary)}
  .rn .cdot{width:10px;height:10px;border-radius:3px;margin:0 5px}
  .bottomnav{display:none}
  .main{padding:20px 24px 40px}
  .only-mobile{display:none!important}
}
@media(max-width:859px){.only-desktop{display:none!important}}
/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.card h3{font-size:14.5px;font-weight:700;margin:10px 0 6px}
.grid{display:grid;gap:14px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:14px}
.kpi .l{font-size:13px;color:var(--text-muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:13px;color:var(--text-muted);margin-top:2px}
.muted{color:var(--text-muted)}.dim{color:var(--text-dim)}.small{font-size:13.5px}
.up{color:var(--crit);font-weight:700}.down{color:var(--ok);font-weight:700}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-ctl);font-weight:700;font-size:15px;background:var(--surface-3);border:1px solid var(--border-light);white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.danger{background:var(--crit);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-muted)}
.chip.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.cb-Carne{background:color-mix(in srgb,var(--c-carne) 18%,transparent);color:var(--c-carne)}
.cb-Grãos{background:color-mix(in srgb,var(--c-graos) 18%,transparent);color:var(--c-graos)}
.cb-Limpeza{background:color-mix(in srgb,var(--c-limpeza) 18%,transparent);color:var(--c-limpeza)}
.cb-Outros{background:color-mix(in srgb,var(--c-outros) 18%,transparent);color:var(--c-outros)}
.b-warn{background:var(--warn-soft);color:var(--warn)}.b-crit{background:var(--crit-soft);color:var(--crit)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-info{background:var(--info-soft);color:var(--info)}
/* formulários */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.lbl{font-size:13.5px;font-weight:600;color:var(--text-muted)}
.req::after{content:" *";color:var(--crit)}
.in,select.in,textarea.in{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r-ctl);background:var(--surface-2);border:1px solid var(--border-light);font-size:16px;color:var(--text)}
textarea.in{min-height:80px;resize:vertical}
.in:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.in.err{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.errmsg{color:var(--crit);font-size:13px;font-weight:600}
.hint{font-size:13px;color:var(--text-dim)}
.frow{display:grid;gap:0 12px}
@media(min-width:600px){.frow.c2{grid-template-columns:1fr 1fr}.frow.c3{grid-template-columns:1fr 1fr 1fr}}
.search{position:relative;flex:1;min-width:200px}
.search input{padding-left:40px}
.search>span>svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--text-dim)}
/* tabelas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--r-card)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;font-weight:700;color:var(--text-muted);background:var(--surface-2);padding:9px 10px;white-space:nowrap;position:sticky;top:0}
table.t td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--row-hover)}
table.t .num,table.t th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:800;background:var(--surface-2)}
/* listas em cartões */
.list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;background:var(--surface)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--border);min-height:60px}
.li:first-child{border-top:0}
.li.click{cursor:pointer}
button.li,.li>button.main-t{text-align:left;width:100%}.li.click:hover{background:var(--row-hover)}
.li .main-t{flex:1;min-width:0}
.li .t1{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:13.5px;color:var(--text-muted)}
.li .rt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
/* barras */
.bar{height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.bar.big{height:18px}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.crit>i{background:var(--crit)}
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.hbar .n{font-weight:700;font-size:14px}
.hbar .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
/* alertas */
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:var(--r-card);margin-bottom:14px;border:1px solid;font-weight:600}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--text)}
.alert.crit{background:var(--crit-soft);border-color:var(--crit);color:var(--text)}
.alert.info{background:var(--info-soft);border-color:var(--info);color:var(--text)}
.alert .ic{font-size:20px;line-height:1.2}
.alert b{display:block}
/* empty */
.empty{text-align:center;color:var(--text-muted);padding:28px 16px}
.empty .ic{font-size:34px;margin-bottom:6px}
.empty b{display:block;color:var(--text);font-size:15.5px;margin-bottom:4px}
/* stepper */
.stp{display:inline-flex;align-items:center;border:1px solid var(--border-light);border-radius:var(--r-ctl);background:var(--surface-2);overflow:hidden;flex:none}
.stp button{width:44px;height:44px;font-size:22px;font-weight:700;color:var(--primary);display:flex;align-items:center;justify-content:center}
.stp button:active{background:var(--primary-soft)}
.stp .sv{min-width:46px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.stp .su{font-size:11px;color:var(--text-dim);display:block;font-weight:600;line-height:1}
/* lista de compras */
.cat-h{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-weight:800;font-size:15px}
.cat-h .sw{width:12px;height:12px;border-radius:4px}
.cat-h .sp{flex:1}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;padding:12px 12px;border-top:1px solid var(--border)}
.sl:first-child{border-top:0}
.sl.done{background:color-mix(in srgb,var(--ok) 8%,transparent)}
.sl.done .nm{color:var(--ok)}
.ck{width:34px;height:34px;border-radius:9px;border:2px solid var(--border-light);display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
.ck svg{width:22px;height:22px;opacity:0;color:#fff}
.sl.done .ck{background:var(--ok);border-color:var(--ok)}
.sl.done .ck svg{opacity:1}
.sl .nm{font-weight:700;font-size:15.5px;min-width:0}
.sl .nm small{display:block;font-weight:500;font-size:12.5px;color:var(--text-dim)}
.sl .fields{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.sl .fields .in{min-height:44px;padding:8px 10px}
.sl .fields .lt{font-weight:800;white-space:nowrap;min-width:84px;text-align:right;padding-bottom:10px;font-variant-numeric:tabular-nums}
.sl .in.est{color:var(--text-dim);font-style:italic}
@media(min-width:700px){.sl{grid-template-columns:auto minmax(160px,1.3fr) 2fr auto}.sl .fields{grid-column:auto}}
.cartbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:44;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(0,0,0,.25);padding:10px 14px;display:flex;align-items:center;gap:12px}
.cartbar .tot{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.cartbar .sub{font-size:12.5px;color:var(--text-muted)}
@media(min-width:860px){.cartbar{left:240px;bottom:0}}
.has-cart .main{padding-bottom:calc(180px + env(safe-area-inset-bottom))}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-ctl);box-shadow:var(--shadow);max-height:300px;overflow:auto;margin-top:4px}
.sugg button{display:flex;width:100%;text-align:left;padding:12px 14px;gap:8px;align-items:center;min-height:48px;border-top:1px solid var(--border)}
.sugg button:first-child{border-top:0}
.sugg button:hover,.sugg button.hl{background:var(--row-hover)}
/* modal (sheet) */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet .sh-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .sh-h h3{font-size:18px;flex:1}
.sheet .sh-f{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sheet .sh-f .btn{flex:1 1 140px}
@media(min-width:700px){.ov{align-items:center}.sheet{max-width:640px;border-radius:18px}.sheet.wide{max-width:860px}.sheet .sh-f .btn{flex:0 0 auto}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:200;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);max-width:92vw;font-size:14.5px}
.toast.crit{background:var(--crit);color:#fff}
@media(min-width:860px){.toast{bottom:30px}}
/* gráficos */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--text-muted);font-size:11px;font-family:inherit}
svg.chart .grid line{stroke:var(--border)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.compra{border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);margin-bottom:10px;overflow:hidden}
.compra-h{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:64px}
.compra-h .d{font-weight:800;font-size:15.5px}
.compra-b{border-top:1px solid var(--border);padding:8px 14px 12px}
.month-h{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:800;margin:16px 4px 8px;display:flex}
.line-ed{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;border:1px solid var(--border);border-radius:var(--r-ctl);margin-bottom:8px;background:var(--surface-2)}
.line-ed .it{grid-column:1/4}
.line-ed .in{background:var(--surface)}
.line-ed .ft{grid-column:1/4;display:flex;align-items:center;justify-content:space-between}
@media(min-width:760px){.line-ed{grid-template-columns:2.4fr 1fr 1fr 1fr auto;align-items:end}.line-ed .it{grid-column:auto}.line-ed .ft{grid-column:auto;gap:8px}}
.pager{display:flex;align-items:center;gap:8px}
.pager .m{font-weight:800;font-size:16px;min-width:150px;text-align:center}
@media print{
  .rail,.bottomnav,.topbar,.no-print,.cartbar{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000;font-size:12px}
  .main{padding:0;max-width:none}
  .card,.tw{border:1px solid #999;box-shadow:none;background:#fff}
  table.t th{background:#eee;color:#000}
  table.t td{color:#000}
  .print-title{display:block!important}
}
.print-title{display:none}
</style>
</head>
<body data-theme="dark">
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Navegação principal"></nav>
  <div class="col">
    <header class="topbar">
      <div class="topbar-row">
        <h1 id="title">Controle de Compras</h1>
        <button class="icon-btn" data-a="theme" title="Alternar tema claro/escuro" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <div class="tabs" id="tabs"></div>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Navegação"></nav>

let S = null;

function stats() {

  D.itens.forEach(i => it[i.id] = { hist: [], qtd: 0, gasto: 0, n: 0, last: null, lastPrice: null, avgPrice: null, prices: [] });
  const compras = D.compras.slice().sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  for (const c of compras) {
    const ym = ymOf(c.data); const M = mon[ym] || (mon[ym] = { total: 0, cat: { 'Carne': 0, 'Grãos': 0, 'Limpeza': 0, 'Outros': 0 }, n: 0 });

      const s = it[l.itemId]; const item = itemById(l.itemId); const cat = item ? item.categoria : 'Outros';

    const q6 = s.hist.filter(h => win.includes(ymOf(h.data))).reduce((a, h) => a + (h.qtd || 0), 0);
    const item = itemById(id); const raw = q6 / 6;

function feiraCalc() {

function barChart(months, opts = {}) {
  const W = 640, H = 240, P = { l: 52, r: 10, t: 14, b: 30 };
  const vals = months.map(ym => opts.cat ? monCat(ym, opts.cat) : monTotal(ym));

  const max = Math.max(10, lim, ...vals) * 1.08;
  const bw = (W - P.l - P.r) / months.length;
  const y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  let g = '<g class="grid">';
  for (let k = 0; k <= 4; k++) { const v = max / 4 * k; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v).toLocaleString('pt-BR')}</text>`; }
  g += '</g>';
  months.forEach((ym, i) => {
    const x = P.l + i * bw + bw * .15, w = bw * .7; let base = 0;
    const cats = opts.cat ? [opts.cat] : CATS;

function feiraSave() {

function updFormTotals() {
  let tot = 0;
  $$('#cf-lines [data-line]').forEach(r => {
    const q = parseNum($('[data-l=qtd]', r).value), p = parseNum($('[data-l=preco]', r).value);
    $('[data-l=qtd]', r).classList.toggle('err', Number.isNaN(q) || (q != null && q <= 0));
    $('[data-l=preco]', r).classList.toggle('err', Number.isNaN(p) || (p != null && p < 0));
    const t = q > 0 && p > 0 ? q * p : 0; tot += t;
    $('[data-l=tot]', r).textContent = t ? brl(t) : '—';
    const nm = $('[data-l=item]', r).value.trim(); const it = nm && itemByName(nm);
    $('[data-l=info]', r).innerHTML = nm ? (it ? catBadge(it.categoria) + (stats().it[it.id].lastPrice ? ' últ. ' + brl(stats().it[it.id].lastPrice) : '') : '<span class="badge b-warn">novo item → Outros</span>') : '';
  });
  const e = $('#cf-total'); if (e) e.textContent = brl(tot);
}
function saveCompraForm() {
  const err = []; $$('[data-form=compra] .in').forEach(e => e.classList.remove('err'));
  const data = $('#cf-data').value, comp = $('#cf-comp').value.trim(), forn = $('#cf-forn').value.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) { err.push('Informe a data.'); $('#cf-data').classList.add('err'); }
  if (!comp) { err.push('Informe o comprador.'); $('#cf-comp').classList.add('err'); }
  const linhas = []; const novos = [];
  $$('#cf-lines [data-line]').forEach((r, k) => {
    const nm = $('[data-l=item]', r).value.trim(), qs = $('[data-l=qtd]', r).value, ps = $('[data-l=preco]', r).value;
    if (!nm && !qs.trim() && !ps.trim()) return; // linha vazia
    const q = parseNum(qs), p = parseNum(ps);
    if (!nm) { err.push(`Linha ${k + 1}: informe o item.`); $('[data-l=item]', r).classList.add('err'); }
    if (!(q > 0)) { err.push(`Linha ${k + 1}: quantidade deve ser um número maior que zero.`); $('[data-l=qtd]', r).classList.add('err'); }
    if (Number.isNaN(p) || (p != null && p < 0)) { err.push(`Linha ${k + 1}: preço inválido.`); $('[data-l=preco]', r).classList.add('err'); }
    linhas.push({ nm, q, p, plan: parseNum($('[data-l=plan]', r).value), obs: $('[data-l=obs]', r).value, marca: $('[data-l=marca]', r).value });
  });
  if (!linhas.length) err.push('Adicione pelo menos um item.');
  if (err.length) { $('#cf-err').innerHTML = err.slice(0, 5).map(esc).join('<br>'); return; }
  const out = linhas.map(l => {
    let it = itemByName(l.nm);
    if (!it) { it = { id: uid('i'), nome: l.nm.charAt(0).toUpperCase() + l.nm.slice(1), categoria: 'Outros', unidade: 'un', fornecedor: '', obs: '' }; D.itens.push(it); novos.push(it.nome); }
    return { itemId: it.id, plan: l.plan || undefined, qtd: l.q, preco: l.p > 0 ? l.p : null, total: l.p > 0 ? Math.round(l.q * l.p * 100) / 100 : null, obs: l.obs || '', marca: l.p > 0 ? '' : l.marca };
  });
  let c = UI.editId && D.compras.find(x => x.id === UI.editId);
  if (c) Object.assign(c, { data, comprador: comp, fornecedor: forn, obs: $('#cf-obs').value.trim(), linhas: out, editadoEm: new Date().toISOString() });
  else { c = { id: uid('c'), data, comprador: comp, fornecedor: forn, obs: $('#cf-obs').value.trim(), origem: 'manual', criadoEm: new Date().toISOString(), linhas: out }; D.compras.push(c); }
  addPessoa(comp); addForn(forn);
  if (save()) { toast('Compra salva' + (novos.length ? ` · ${novos.length} item(ns) novo(s) em Outros` : '')); UI.editId = null; UI.open[c.id] = true; UI.tab.compras = 'hist'; UI.f.pm = ''; go('compras'); }
}

    <div class="card"><h2>⚙️ Ajustes</h2><form data-form="ajustes" novalidate><div class="frow c2">
    <div class="field"><label for="aj-pct">Alerta de preço: aumento acima de (%)</label><input class="in" id="aj-pct" inputmode="decimal" value="${numStr(D.config.alertaPct)}"><span class="hint">Compara o último preço com a média dos preços anteriores.</span></div>
    <div class="field"><label for="aj-comp">Compradores (separados por vírgula)</label><input class="in" id="aj-comp" value="${esc(D.compradores.join(', '))}"></div></div>
    <div class="row"><button class="btn" type="button" data-a="theme">🌓 Tema: ${D.config.tema === 'light' ? 'claro' : 'escuro'}</button><span class="sp"></span><button class="btn primary" type="submit">Salvar ajustes</button></div><div id="aj-err" class="errmsg"></div></form></div>
    <div class="card"><h2>📱 Instalar no celular</h2><p class="muted small">Para usar offline como app: publique a pasta (com <code>manifest.json</code>, <code>sw.js</code> e ícones) em um endereço https (ex.: GitHub Pages) ou sirva localmente, abra no Chrome do celular e toque em “Adicionar à tela inicial”. Aberto por duplo clique (file://) o app funciona normalmente, mas sem instalação.</p><div class="hint" style="margin-top:6px">Status: ${location.protocol.startsWith('http') ? ('serviceWorker' in navigator ? 'modo offline disponível' : 'navegador sem suporte a offline') : 'aberto como arquivo local'}</div></div>`;
}

/* ---------- eventos (delegação) ---------- */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); closeModal(); const [v, p] = g.dataset.go.split('/'); go(v, p); return; }
  const tb = e.target.closest('[data-tab]');
  if (tb) {
    const [k, v] = tb.dataset.tab.split(':');
    if (k === 'cat') return go('cat', v);
    if (k === 'feira') { if (v === 'mercado') toMarket(); else { D.feira.status = 'plano'; save(); render(); } return; }
    if (k === 'compras' && v === 'hist') UI.editId = null;
    UI.tab[k] = v; render(); return;
  }
  if (e.target.matches('[data-ov]')) { closeModal(); return; }
  const a = e.target.closest('[data-a]'); if (!a) { const s = $('#madd-s'); if (s && !e.target.closest('.search')) s.hidden = true; return; }
  const act = a.dataset.a, id = a.dataset.id;
  switch (act) {
    case 'modal-close': closeModal(); break;
    case 'more': moreMenu(); break;
    case 'theme': D.config.tema = D.config.tema === 'light' ? 'dark' : 'light'; save(); render(); break;
    case 'painel-per': UI.f.painelPer = a.dataset.k; render(); break;
    case 'item': if (a.tagName === 'SELECT') break; itemModal(id); break;
    case 'item-edit': closeModal(); itemForm(id); break;
    case 'item-new': itemForm(null); break;
    case 'item-del': {
      const i = itemById(id); const n = D.compras.reduce((s, c) => s + c.linhas.filter(l => l.itemId === id).length, 0);
      if (n) { openModal(mhead('Não é possível excluir') + `<p>“${esc(i.nome)}” aparece em <b>${n}</b> linha(s) de compras. Excluir apagaria esse histórico.</p><p class="muted small" style="margin-top:8px">Você pode renomear o item ou mudar a categoria em “Editar”.</p><div class="sh-f"><button class="btn primary" data-a="modal-close">Entendi</button></div>`); break; }
      if (await confirmBox('Excluir item', `<p>Excluir “${esc(i.nome)}”?</p>`, 'Excluir', true)) { D.itens = D.itens.filter(x => x.id !== id); if (D.feira) D.feira.linhas = D.feira.linhas.filter(l => l.itemId !== id); save(); toast('Item excluído'); render(); }
      break;
    }
    case 'icat': UI.f.icat = a.dataset.c; render(); break;
    // feira
    case 'feira-new': D.feira = newFeira(); if (a.dataset.m !== 'zero') feiraFill(a.dataset.m); save(); UI.f.fonly = a.dataset.m !== 'zero'; render(); break;
    case 'feira-fill': feiraFill(a.dataset.m); save(); render(); break;
    case 'feira-zero': if (await confirmBox('Zerar quantidades', '<p>Zerar todas as quantidades planejadas?</p>', 'Zerar', true)) { D.feira.linhas = D.feira.linhas.filter(l => l.extra || l.preco > 0); D.feira.linhas.forEach(l => l.plan = 0); save(); render(); } break;
    case 'feira-discard': if (await confirmBox('Descartar feira', '<p>Descartar a feira em andamento? Nada será registrado.</p>', 'Descartar', true)) { D.feira = null; save(); toast('Feira descartada'); render(); } break;
    case 'fcat': UI.f.fcat = a.dataset.c; render(); break;
    case 'fonly': UI.f.fonly = !UI.f.fonly; render(); break;
    case 'fplan': case 'fqtd': {
      const it = itemById(id); const l = fLine(id); const st = stepOf(it) * (+a.dataset.d);
      if (act === 'fplan') { l.plan = Math.max(0, Math.round(((l.plan || 0) + st) * 1000) / 1000); if (!(l.preco > 0)) l.qtd = l.plan || null; }
      else { l.qtd = Math.max(0, Math.round(((l.qtd || 0) + st) * 1000) / 1000); if (l.qtd > 0) l.nao = false; }
      const v = act === 'fplan' ? l.plan : l.qtd; const sp = $(`[data-sv="${act}-${id}"]`); if (sp) sp.textContent = v > 0 ? fmtN(v, 3) : '0';
      if (act === 'fplan') { const row = $(`[data-row="${id}"]`); if (row) row.style.background = l.plan > 0 ? 'var(--primary-soft)' : ''; feiraBar(); } else updMRow(id);
      saveSoon(); break;
    }
    case 'feira-market': toMarket(); break;
    case 'fok': { const l = fLine(id); l.ok = !(l.ok || l.preco > 0); if (!l.ok) l.preco = l.preco; l.nao = false; if (!l.ok && l.preco > 0) { l.preco = null; const inp = $(`#p-${CSS.escape(id)}`); if (inp) inp.value = ''; } updMRow(id); saveSoon(); break; }
    case 'fnao': { const l = fLine(id); l.nao = !l.nao; if (l.nao) l.ok = false; save(); render(); break; }
    case 'frm': { D.feira.linhas = D.feira.linhas.filter(l => l.itemId !== id); save(); render(); break; }
    case 'madd': addExtra(id); break;
    case 'madd-new': {
      const nm = $('#madd').value.trim(); if (!nm) break;
      openModal(mhead('Novo item: ' + esc(nm)) + `<p class="muted" style="margin-bottom:10px">Escolha a categoria:</p><div class="grid g2">${CATS.map(c => `<button class="btn block" data-a="madd-cat" data-c="${c}" data-n="${esc(nm)}" style="min-height:56px">${CATIC[c]} ${c}</button>`).join('')}</div>`);
      break;
    }
    case 'madd-cat': { const it = { id: uid('i'), nome: a.dataset.n.charAt(0).toUpperCase() + a.dataset.n.slice(1), categoria: a.dataset.c, unidade: 'un', fornecedor: '', obs: '' }; D.itens.push(it); closeModal(); addExtra(it.id); break; }
    case 'feira-finish': feiraFinishModal(); break;
    case 'feira-save': feiraSave(); break;
    // gastos
    case 'gym': { const n = addM(UI.f.gym || curYM(), +a.dataset.d); if (n <= curYM()) { UI.f.gym = n; render(); } break; }
    // compras
    case 'ctoggle': UI.open[id] = !UI.open[id]; render(); break;
    case 'pclear': UI.f.pm = UI.f.pc = UI.f.pf = UI.f.pb = ''; render(); break;
    case 'compra-new': UI.editId = null; UI.tab.compras = 'nova'; render(); break;
    case 'compra-edit': UI.editId = id; UI.tab.compras = 'nova'; render(); window.scrollTo(0, 0); break;
    case 'compra-cancel': UI.editId = null; UI.tab.compras = 'hist'; render(); break;
    case 'compra-del': { const c = D.compras.find(x => x.id === id); if (await confirmBox('Excluir compra', `<p>Excluir a compra de <b>${fmtDate(c.data)}</b> (${c.linhas.length} itens, ${brl(compraTotal(c))})? Esta ação não pode ser desfeita (faça um backup antes, se precisar).</p>`, 'Excluir', true)) { D.compras = D.compras.filter(x => x.id !== id); save(); toast('Compra excluída'); render(); } break; }
    case 'line-add': { $('#cf-lines').insertAdjacentHTML('beforeend', lineRow({})); const ins = $$('#cf-lines [data-l=item]'); ins[ins.length - 1].focus(); break; }
    case 'line-del': { const r = a.closest('[data-line]'); if ($$('#cf-lines [data-line]').length > 1) r.remove(); else $$('input', r).forEach(i => i.value = ''); updFormTotals(); break; }
    // fornecedores
    case 'forn-new': fornForm(null); break;
    case 'forn-edit': fornForm(id); break;
    case 'forn-del': { const f = D.fornecedores.find(x => x.id === id); if (await confirmBox('Excluir fornecedor', `<p>Excluir “${esc(f.nome)}”? As compras já registradas mantêm o nome.</p>`, 'Excluir', true)) { D.fornecedores = D.fornecedores.filter(x => x.id !== id); save(); render(); } break; }
    // relatórios
    case 'csv-rel': csvRel(); break;
    case 'csv-all': csvAll(); break;
    case 'print': window.print(); break;
    // backup
    case 'exp-json': download(`controle-compras-backup-${hoje()}.json`, JSON.stringify(D, null, 1), 'application/json'); toast('Backup exportado'); break;
    case 'restore': if (await confirmBox('Restaurar dados originais', '<p>Substituir <b>todos</b> os dados atuais (compras, itens, fornecedores, feira em andamento e limites) pelos dados originais extraídos da planilha?</p><p class="muted small" style="margin-top:8px">Dica: exporte um backup antes.</p>', 'Restaurar', true)) { const tema = D.config.tema; D = normalize(seedData()); D.config.tema = tema; save(); toast('Dados originais restaurados'); go('painel'); } break;
  }
});
function toMarket() {
  const F = D.feira; if (!F) return;
  if (!F.linhas.some(l => l.plan > 0 || l.extra)) { toast('Defina a quantidade de pelo menos um item', 'crit'); return; }
  F.linhas.forEach(l => { if (l.plan > 0 && (l.qtd == null)) l.qtd = l.plan; });
  F.status = 'mercado'; save(); window.scrollTo(0, 0); render();
}
function addExtra(id) {
  const l0 = fLine(id, false); if (l0 && (l0.plan > 0 || l0.extra)) { const s = $('#madd-s'); if (s) s.hidden = true; $('#madd').value = ''; l0.nao = false; save(); render(); setTimeout(() => { const r = $(`[data-row="${CSS.escape(id)}"]`); if (r) { r.scrollIntoView({ block: 'center' }); r.animate([{ outline: '3px solid var(--primary)' }, { outline: '3px solid transparent' }], 1500); const inp = $(`#p-${CSS.escape(id)}`); if (inp) inp.focus(); } }, 50); return; }
  const l = fLine(id); const it = itemById(id);
  if (!(l.plan > 0)) { l.extra = true; l.qtd = l.qtd > 0 ? l.qtd : stepOf(it); }
  l.nao = false; save(); render();
  setTimeout(() => { const inp = $(`#p-${CSS.escape(id)}`); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); } }, 50);
}
document.addEventListener('input', e => {
  const t = e.target; const f = t.dataset.f;
  if (f === 'mpreco') {
    const l = fLine(t.dataset.id); const v = parseNum(t.value);
    t.classList.toggle('err', Number.isNaN(v) || (v != null && v < 0));
    if (!Number.isNaN(v)) { l.preco = v > 0 ? v : null; if (v > 0) { l.ok = true; l.nao = false; } updMRow(t.dataset.id); saveSoon(); }
    return;
  }
  if (f === 'madd') { mSuggest(t.value); return; }
  if (f === 'fq' || f === 'cq' || f === 'iq') { UI.f[f] = t.value; clearTimeout(UI.qT); UI.qT = setTimeout(() => { render(); const n = $(`[data-f="${f}"]`); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); return; }
  if (t.closest('#cf-lines')) updFormTotals();
});
document.addEventListener('focusin', e => { if (e.target.id === 'madd') mSuggest(e.target.value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-slot').innerHTML) closeModal();
  if (e.key === 'Enter' && e.target.id === 'madd') { e.preventDefault(); const b = $('#madd-s button'); if (b) b.click(); }
});
document.addEventListener('change', e => {
  const t = e.target; const f = t.dataset.f;
  if (['pm', 'pc', 'pf', 'pb', 'csort', 'ry'].includes(f)) { UI.f[f] = t.value; render(); return; }
  if (t.dataset.aChange === 'item-cat') { const i = itemById(t.dataset.id); i.categoria = t.value; save(); toast(`“${i.nome}” agora em ${t.value}`); const id = i.id; render(); itemModal(id); return; }
  if (t.id === 'imp-file' && t.files[0]) {
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.itens) || !Array.isArray(d.compras)) throw new Error('arquivo não parece um backup deste app (faltam “itens” e “compras”)');
        if (d.compras.some(c => !/^\d{4}-\d{2}-\d{2}$/.test(c.data || '') || !Array.isArray(c.linhas))) throw new Error('há compras com data ou linhas inválidas');
        if (await confirmBox('Importar backup', `<p>Substituir os dados atuais por <b>${d.compras.length}</b> compras e <b>${d.itens.length}</b> itens do arquivo?</p>`, 'Importar', true)) { D = normalize(d); save(); toast('Backup importado'); go('painel'); }
      } catch (err) { toast('Importação falhou: ' + err.message, 'crit'); }
      t.value = '';
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const k = f.dataset.form;
  if (k === 'compra') return saveCompraForm();
  if (k === 'item') return saveItemForm(f);
  if (k === 'forn') {
    const nome = $('#fo-nome').value.trim(); if (!nome) { $('#fo-err').textContent = 'Informe o nome.'; $('#fo-nome').classList.add('err'); return; }
    const dup = D.fornecedores.find(x => norm(x.nome) === norm(nome) && x.id !== f.dataset.id); if (dup) { $('#fo-err').textContent = 'Já existe um fornecedor com esse nome.'; return; }
    const v = { nome, telefone: $('#fo-tel').value.trim(), endereco: $('#fo-end').value.trim(), obs: $('#fo-obs').value.trim() };
    if (f.dataset.id) Object.assign(D.fornecedores.find(x => x.id === f.dataset.id), v); else D.fornecedores.push(Object.assign({ id: uid('fo') }, v));
    save(); closeModal(); toast('Fornecedor salvo'); render(); return;
  }
  if (k === 'limites') {
    const err = []; const g = parseNum($('#lim-g').value);
    $$('[data-form=limites] .in').forEach(x => x.classList.remove('err'));
    if (Number.isNaN(g) || (g != null && g <= 0)) { err.push('Limite geral inválido.'); $('#lim-g').classList.add('err'); }
    const oc = {}; $$('[data-cat]', f).forEach(x => { const v = parseNum(x.value); if (Number.isNaN(v) || (v != null && v <= 0)) { err.push(`Limite de ${x.dataset.cat} inválido.`); x.classList.add('err'); } else if (v) oc[x.dataset.cat] = v; });
    if (err.length) { $('#lim-err').textContent = err.join(' '); return; }
    D.config.orcGeral = g || null; D.config.orcCat = oc; save(); toast('Limites salvos'); UI.tab.gastos = 'resumo'; render(); return;
  }
  if (k === 'ajustes') {
    const p = parseNum($('#aj-pct').value); if (!(p > 0 && p < 1000)) { $('#aj-err').textContent = 'Percentual inválido.'; $('#aj-pct').classList.add('err'); return; }
    const cs = $('#aj-comp').value.split(',').map(s => s.trim()).filter(Boolean); if (!cs.length) { $('#aj-err').textContent = 'Informe pelo menos um comprador.'; return; }
    D.config.alertaPct = p; D.compradores = cs; save(); toast('Ajustes salvos'); render();
  }
});
window.addEventListener('hashchange', () => { closeModal(); render(); });
window.addEventListener('storage', e => { if (e.key === LS) { load(); render(); } });

/* ---------- PWA (só quando servido por http/https) ---------- */
function pwa() {
  if (!location.protocol.startsWith('http')) return;
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
  const ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; ap.href = 'icon-192.png'; document.head.appendChild(ap);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW não registrado:', err.message));
}

/* ---------- início ---------- */
load(); render(); pwa();

</script>
</body>
